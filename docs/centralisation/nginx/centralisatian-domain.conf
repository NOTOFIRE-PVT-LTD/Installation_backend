# Production path layout (same as live EC2 today).
# 1) Copy to server: /etc/nginx/sites-available/centralisation
# 2) Replace YOUR_DOMAIN with the real hostname
# 3) sudo ln -sf ... sites-enabled; nginx -t; reload
# 4) certbot --nginx -d YOUR_DOMAIN
#
# Paths:
#   /           → P&L Next (:3000)
#   /ws/        → Workspace static
#   /ws-api/    → Installation API (:5000)
#   /ship-app/  → Shipping (:3002)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name YOUR_DOMAIN;

    location /ws-api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ship-app {
        return 302 /ship-app/?$args;
    }

    location /ship-app/ {
        proxy_pass http://127.0.0.1:3002/ship-app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /dashboard {
        return 302 /ws/dashboard;
    }

    location = /ws {
        return 301 /ws/;
    }

    location ^~ /ws/assets/ {
        alias /var/www/workspace-web/dist/assets/;
        access_log off;
        expires 7d;
    }

    location ^~ /ws/icons/ {
        alias /var/www/workspace-web/dist/icons/;
        access_log off;
        expires 7d;
    }

    location = /ws/favicon.png {
        alias /var/www/workspace-web/dist/favicon.png;
    }

    location = /ws/manifest.webmanifest {
        alias /var/www/workspace-web/dist/manifest.webmanifest;
        default_type application/manifest+json;
    }

    location = /ws/manifest.json {
        alias /var/www/workspace-web/dist/manifest.json;
    }

    location = /ws/sw.js {
        alias /var/www/workspace-web/dist/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /ws/index.html {
        alias /var/www/workspace-web/dist/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /ws/ {
        alias /var/www/workspace-web/dist/;
        try_files $uri $uri/ @ws_spa;
    }

    location @ws_spa {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        rewrite ^ /ws/index.html last;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
