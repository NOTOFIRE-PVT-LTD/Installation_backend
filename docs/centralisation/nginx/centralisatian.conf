# Path split (one public IP):
#   /          → Installation portal + Workspace UI (Vite)
#   /ws-api/   → Installation_backend (Express)
#   /pnl/      → Centralisation P&L (Next.js)
#   /lead-track/ → LeadTrack Sales Tracker CRM (Next.js)
#
# Dev hostnames alternative:
#   127.0.0.1 portal.localhost pnl.localhost
#
# Upstream ports:
#   P&L Next.js          :3000
#   LeadTrack Next.js    :3010
#   Installation Vite    :5173
#   Installation API     :5000

upstream pnl_app {
    server 127.0.0.1:3000;
}

upstream leadtrack_app {
    server 127.0.0.1:3010;
}

upstream portal_web {
    server 127.0.0.1:5173;
}

upstream workspace_api {
    server 127.0.0.1:5000;
}

server {
    listen 80 default_server;
    server_name _;

    # Installation API
    location /ws-api/ {
        proxy_pass http://workspace_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # P&L (Next) under /pnl/
    location /pnl/ {
        proxy_pass http://pnl_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /pnl;
    }

    # LeadTrack (Next) under /lead-track/
    location /lead-track/ {
        proxy_pass http://leadtrack_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /lead-track;
    }

    # Portal login + /apps + Workspace UI (Vite)
    location / {
        proxy_pass http://portal_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
